name: lint

on:
  workflow_call:

jobs:
  run:
    name: lint code
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: install dependencies
        run: npm ci

      - name: validate code
        run: npm run typecheck

      - name: analise eslint
        run: npm run lint

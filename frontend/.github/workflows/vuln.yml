name: security audit

on:
  workflow_call:

jobs:
  run:
    name: check vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: run security audit
        run: npm audit --audit-level=high
